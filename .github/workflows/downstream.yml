name: Test downstream projects

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: downstream-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipykernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jupyterlab/maintainer-tools/.github/actions/base-setup@b9d5c28489f8b460cef48868f303b97c20f8fe1b # v1.1.2
      - uses: jupyterlab/maintainer-tools/.github/actions/downstream-test@b9d5c28489f8b460cef48868f303b97c20f8fe1b # v1.1.2
        with:
          package_name: ipykernel

  nbclient:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jupyterlab/maintainer-tools/.github/actions/base-setup@b9d5c28489f8b460cef48868f303b97c20f8fe1b # v1.1.2
      - uses: jupyterlab/maintainer-tools/.github/actions/downstream-test@b9d5c28489f8b460cef48868f303b97c20f8fe1b # v1.1.2
        with:
          package_name: nbclient
          env_values: IPYKERNEL_CELL_NAME=\<IPY-INPUT\>

  nbconvert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jupyterlab/maintainer-tools/.github/actions/base-setup@b9d5c28489f8b460cef48868f303b97c20f8fe1b # v1.1.2
      - uses: jupyterlab/maintainer-tools/.github/actions/downstream-test@b9d5c28489f8b460cef48868f303b97c20f8fe1b # v1.1.2
        with:
          package_name: nbconvert
          package_spec: -e ".[test]"

  jupyter_server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jupyterlab/maintainer-tools/.github/actions/base-setup@b9d5c28489f8b460cef48868f303b97c20f8fe1b # v1.1.2
      - uses: jupyterlab/maintainer-tools/.github/actions/downstream-test@b9d5c28489f8b460cef48868f303b97c20f8fe1b # v1.1.2
        with:
          package_name: jupyter_server

  jupyter_client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Base Setup
        uses: jupyterlab/maintainer-tools/.github/actions/base-setup@b9d5c28489f8b460cef48868f303b97c20f8fe1b # v1.1.2

      - name: Run Test
        uses: jupyterlab/maintainer-tools/.github/actions/downstream-test@b9d5c28489f8b460cef48868f303b97c20f8fe1b # v1.1.2
        with:
          package_name: jupyter_client
          package_spec: "anyio .[test]"

  pytest_jupyter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Base Setup
        uses: jupyterlab/maintainer-tools/.github/actions/base-setup@b9d5c28489f8b460cef48868f303b97c20f8fe1b # v1.1.2

      - name: Run Test
        uses: jupyterlab/maintainer-tools/.github/actions/downstream-test@b9d5c28489f8b460cef48868f303b97c20f8fe1b # v1.1.2
        with:
          package_name: pytest_jupyter
          package_spec: -e ".[test,client,server]"
